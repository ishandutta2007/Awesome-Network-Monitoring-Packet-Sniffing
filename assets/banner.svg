<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Packet Stream Beam Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }

    /* Dynamic SVG Animations */
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 600; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes packetFlow {
      0% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1000px); opacity: 0; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .animated-beam {
      stroke-dasharray: 80, 160;
      animation: pulseBeam 4s linear infinite;
    }
    .radar {
      transform-origin: 1080px 80px;
      animation: radarSweep 8s linear infinite;
    }
    .floating-card-1 {
      animation: floatCard 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard 6s ease-in-out infinite 3s;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />
  <rect width="100%" height="100%" fill="url(#cyberGrid)" rx="16" />

  <!-- Animated Background Network Flow Lines (Subtle & In Background) -->
  <g opacity="0.4">
    <path d="M 0,290 Q 300,230 600,290 T 1200,270" fill="none" stroke="#0284c7" stroke-width="2" class="animated-beam" />
    <path d="M 0,320 Q 400,260 800,320 T 1200,300" fill="none" stroke="#6366f1" stroke-width="1.5" class="animated-beam" style="animation-delay: -2s;" />
    <path d="M 0,260 Q 200,310 600,260 T 1200,280" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10,15" />
  </g>

  <!-- Decorative Corner Radar Grid (Top Right) -->
  <g opacity="0.35">
    <circle cx="1080" cy="80" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="1080" cy="80" r="45" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="1080" cy="80" r="20" fill="none" stroke="#38bdf8" stroke-width="1" />
    <line x1="1010" y1="80" x2="1150" y2="80" stroke="#38bdf8" stroke-width="1" />
    <line x1="1080" y1="10" x2="1080" y2="150" stroke="#38bdf8" stroke-width="1" />
    <!-- Radar Sweep Hand -->
    <line x1="1080" y1="80" x2="1145" y2="55" stroke="#00f2fe" stroke-width="2" class="radar" filter="url(#glow)" />
  </g>

  <!-- Dynamic Flying Hex Packets across bottom track -->
  <g opacity="0.7">
    <circle cx="150" cy="290" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cx" values="0;1200" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="305" r="3" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="cx" values="0;1200" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="275" r="5" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content: Brand Pills -->
  <g transform="translate(60, 50)">
    <!-- Pill 1: Status -->
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" class="badge-text" fill="#cbd5e1">DEEP PACKET INSPECTION</text>

    <!-- Pill 2: Protocol -->
    <rect x="175" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="187" y="18" class="badge-text" fill="#93c5fd">PCAP &amp; eBPF FLOWS</text>

    <!-- Pill 3: Ecosystem -->
    <rect x="325" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="337" y="18" class="badge-text" fill="#c084fc">NIDS &amp; TELEMETRY</text>
  </g>

  <!-- Main Title & Subtitle (In crisp foreground, high contrast, guaranteed readable) -->
  <g transform="translate(60, 130)">
    <!-- Brand Icon SVG (Network packet radar node) -->
    <g transform="translate(0, -32)">
      <rect x="0" y="0" width="48" height="48" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Wire symbol -->
      <path d="M 12,24 L 20,16 L 28,32 L 36,24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="12" cy="24" r="2.5" fill="#38bdf8" />
      <circle cx="36" cy="24" r="2.5" fill="#38bdf8" />
    </g>

    <!-- Title -->
    <text x="64" y="5" class="title" fill="url(#titleGradient)">Network Monitoring &amp; Packet Sniffing</text>
    
    <!-- Subtitle -->
    <text x="0" y="48" class="subtitle">The definitive curated guide to DPI engines, TUI/CLI packet analyzers, eBPF telemetry, and enterprise SaaS</text>

    <!-- Decorative Metric Metrics / Tag Stream -->
    <g transform="translate(0, 80)">
      <text font-family="'SF Mono', Monaco, monospace" font-size="13" fill="#64748b">
        <tspan fill="#38bdf8">WIRE-SPEED PCAP</tspan> • 
        <tspan fill="#818cf8">SURICATA / ZEEK NSM</tspan> • 
        <tspan fill="#34d399">SNMP / NETFLOW v9 / IPFIX</tspan> • 
        <tspan fill="#f472b6">REAL-TIME eBPF KERNEL TRACING</tspan>
      </text>
    </g>
  </g>

  <!-- Interactive/Dynamic Status Telemetry Cards (Right Side Foreground) -->
  <g transform="translate(900, 180)" class="floating-card-1">
    <rect width="240" height="65" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <text x="16" y="24" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#94a3b8">PACKET INGESTION</text>
    <text x="16" y="48" font-family="'SF Mono', Monaco, monospace" font-size="18" font-weight="700" fill="#38bdf8">10.42 Mpps</text>
    <path d="M 160,42 Q 175,25 190,40 T 225,28" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="225" cy="28" r="3" fill="#10b981" />
  </g>

  <g transform="translate(940, 260)" class="floating-card-2">
    <rect width="200" height="55" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <text x="14" y="22" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#94a3b8">L7 PROTOCOL PARSING</text>
    <text x="14" y="42" font-family="'SF Mono', Monaco, monospace" font-size="14" font-weight="700" fill="#a855f7">TLS 1.3 / HTTP / DNS</text>
    <circle cx="180" cy="30" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="100%" height="4" fill="url(#titleGradient)" rx="2" />
</svg>
